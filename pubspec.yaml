name: family_management_app
description: HomeHub AI - Smart Home Management System for families
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  fl_chart: ^0.66.0
  uuid: ^4.2.1
  intl: ^0.19.0
  google_fonts: ^6.1.0
  flutter_animate: ^4.3.0
  animated_text_kit: ^4.2.2
  http: ^1.2.0

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.4
  cloud_firestore: ^4.15.4
  google_sign_in: ^6.2.1
  url_launcher: ^6.3.2

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  firebase_messaging: ^14.9.4
  cloud_functions: ^4.7.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#C8D5C8"
  adaptive_icon_foreground: "assets/app_icon.png"

flutter:
  uses-material-design: true
